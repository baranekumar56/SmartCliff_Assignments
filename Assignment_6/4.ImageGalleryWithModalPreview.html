<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery with Modal Preview</title>
  <style>
    .modal {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }
    .modal img {
      max-width: 90%;
      max-height: 90%;
    }
  </style>
</head>
<body>
  <h2>Image Gallery</h2>
  <div class="gallery">
    <img src="https://picsum.photos/id/1015/200/150" alt="img1">
    <img src="https://picsum.photos/id/1016/200/150" alt="img2">
    <img src="https://picsum.photos/id/1018/200/150" alt="img3">
    <img src="https://picsum.photos/id/1020/200/150" alt="img4">
  </div>

  <div class="modal" id="imageModal">
    <img id="modalImg" src="">
  </div>

  <script>
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const thumbnails = document.querySelectorAll(".gallery img");

    thumbnails.forEach(img => {
      img.addEventListener("click", () => {
        modal.style.display = "flex";
        modalImg.src = img.src.replace("/200/150", "/600/400");
      });
    });

    modal.addEventListener("click", e => {
      if (e.target !== modalImg) {
        modal.style.display = "none";
        modalImg.src = "";
      }
    });
  </script>
</body>
</html>
