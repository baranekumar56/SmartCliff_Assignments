<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <label>Essay:</label>
    <br></br>
    <textarea id="draft" rows="5" cols="20" placeholder="Write your essay here"></textarea>

    <script>
       
        const draft = document.getElementById('draft');
        
        // set listeners first

        draft.value = localStorage.getItem('draft')

        draft.addEventListener('input', (e) => {
            localStorage.setItem('draft', e.target.value);
        })
    </script>
</body>
</html>
